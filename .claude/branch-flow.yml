# Branch Flow — VibeLign
#
# strategy 이하는 user-scope(~/.claude/branch-flow.yml) 와 같은 값이다.
# 이 파일을 만든 목적은 merge_gate.accepted_risks 하나이며, 리뷰 강도를
# 낮추지 않는다 (default_level: strict — 정책 파일이 없을 때의 폴백과 동일).

strategy: simple

base: main

protected:
  - main

feature:
  naming: "feature/{description}"
  allow_rebase: true
  allow_force_push: true
  allow_reset: true

merge:
  auto_merge: true
  delete_branch: true
  require_ci: false

recovery:
  protected_branch: revert-only
  feature_branch: any

merge_gate:
  # 정책 파일이 없을 때의 폴백과 같은 값. change_types 를 두지 않으므로
  # 어떤 경로도 strict 아래로 내려가지 않는다.
  default_level: strict

  accepted_risks:
    # 앵커 파서 PR 의 적대 리뷰가 tool_install.rs 전체를 훑다가 발견한
    # 기존 결함이다. 확인 결과:
    #   - curl|bash / irm|iex 는 origin/main 에 이미 있다
    #   - 앵커 PR 들이 이 파일에서 바꾼 것은 앵커 주석 4줄뿐이다
    #     (2 insertions, 4 deletions — 설치 로직 미변경)
    # 설치 경로 수정은 릴리스 파이프라인·플랫폼별 검증이 얽혀 있어 별도
    # 작업이어야 하므로 이슈로 분리하고, 그 기간만 수용한다.
    #
    # 파일이 아니라 "그 파일의 셸 파이프 설치 관용구" 로 좁힌다.
    #   - 파일 단위: 나중에 같은 파일에 들어온 다른 종류의 RCE 도 통과 → 너무 넓다
    #   - curl/irm/iex 언급: curl 을 쓰는 새 명령 주입도 통과 → 여전히 넓다
    #   - `curl | bash` / `irm | iex` 파이프 형태 명시: 이 기존 결함에 밀착
    #
    # 한계는 분명하다 — 이 게이트의 waiver 는 리뷰어가 쓴 **제목 문자열**에
    # 정규식을 걸 뿐, 커밋·hunk 지문에 묶을 수단이 없다. 그래서 만료를 30일로
    # 짧게 잡아 노출 기간 자체를 줄인다. 이슈 #8 이 처리되면 삭제할 것.
    - id: "tool-install-remote-shell-exec"
      match: "tool_install\\.rs.*(curl \\| bash|irm \\| iex)"
      reason: "origin/main 기존 결함(설치 스크립트를 파이프로 무검증 실행). 앵커 PR 은 이 파일의 앵커 주석 4줄만 변경. 이슈 #8 에서 버전 고정·SHA-256 검증·파이프 제거로 처리. 제목 정규식이라 지문 결속 불가 — 만료를 30일로 제한."
      accepted_by: "choa712"
      expires: "2026-09-09"
