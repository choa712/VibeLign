# Branch Flow — VibeLign
#
# 이 파일의 목적은 merge_gate.accepted_risks 하나다.
#
# strategy·merge·recovery 는 일부러 두지 않는다. 처음엔 user-scope 값을
# 복사했는데, 그러면 auto_merge/require_ci 같은 설정이 리포 정책으로 굳어
# waiver 와 맞물려 위험을 키운다 (적대 리뷰 지적). 브랜치 전략은 예전처럼
# user-scope(~/.claude/branch-flow.yml) 를 그대로 쓴다.

merge_gate:
  # 정책 파일이 없을 때의 폴백과 같은 값. change_types 를 두지 않으므로
  # 어떤 경로도 strict 아래로 내려가지 않는다.
  default_level: strict

  accepted_risks:
    # 앵커 파서 PR 의 적대 리뷰가 tool_install.rs 전체를 훑다가 발견한
    # 기존 결함이다. 확인 결과:
    #   - curl|bash / irm|iex 는 origin/main 에 이미 있다
    #   - 앵커 PR 들이 이 파일에서 바꾼 것은 앵커 주석 4줄뿐이다
    #     (2 insertions, 4 deletions — 설치 로직 미변경)
    # 설치 경로 수정은 릴리스 파이프라인·플랫폼별 검증이 얽혀 있어 별도
    # 작업이어야 하므로 이슈로 분리하고, 그 기간만 수용한다.
    #
    # 정체성 결속은 정규식이 아니라 **테스트**가 맡는다.
    # tests/test_waived_risk_blob_pinning.py 가 tool_install.rs 의 SHA-256 을
    # 검토 시점 값으로 고정한다. 그 파일에 새 변경이 들어오면 테스트가 깨지고
    # waiver 의 전제("검토한 그 기존 결함")를 다시 따지게 된다.
    #
    # 그래서 여기 정규식은 "무엇에 관한 지적인가"만 가른다. 파이프 형태까지
    # 좁혔더니 리뷰어가 표현을 바꿀 때마다 매칭이 어긋났다 — 좁히는 방향은
    # 이 게이트(제목 문자열 정규식)로는 신뢰할 수 없다. 대신 파일 + 원격 셸
    # 실행 어휘로 주제를 고정하고, 정체성은 위 테스트가 지킨다.
    #
    # 만료 30일. 이슈 #8 이 처리되면 waiver 와 그 테스트를 함께 삭제할 것.
    - id: "tool-install-remote-shell-exec"
      match: "tool_install\\.rs.*(curl|irm|iex|bash|shell|remote)"
      reason: "origin/main 기존 결함(설치 스크립트를 파이프로 무검증 실행). 앵커 PR 은 이 파일의 앵커 주석 4줄만 변경. 이슈 #8 에서 버전 고정·SHA-256 검증·파이프 제거로 처리. 제목 정규식이라 지문 결속 불가 — 만료를 30일로 제한."
      accepted_by: "choa712"
      expires: "2026-09-09"

    # `vib anchor --repair` 가 파일을 교체하는 순간과, 편집기가 같은 파일을
    # 저장하는 순간 사이의 경합. 리뷰어가 "확인 뒤 os.replace 전에 저장하면
    # 덮인다" 고 반복 지적했고, 그건 사실이다. 다만 고칠 수 있는 결함이
    # 아니다:
    #
    #   - POSIX 에 "내용이 그대로일 때만 교체" 하는 원자적 API 가 없다.
    #     os.replace 는 원자적이지만 조건부가 아니다.
    #   - 권고 잠금(flock)은 편집기가 잡아주지 않으면 아무 효과가 없다.
    #
    # 할 수 있는 건 창을 줄이는 것뿐이고, 그건 했다: 임시 파일을 끝까지
    # 준비(쓰기·fsync)한 뒤 확인과 os.replace 사이에 I/O 를 하나도 두지
    # 않는다. tests/test_anchor_symbol_zone_match.py 의
    # test_repair_aborts_when_the_file_changed_mid_analysis 가 stage 직후
    # 저장을 모의해 이 방어가 실제로 도는 것을 고정한다.
    #
    # 같은 성질의 경합은 git·포매터·IDE 의 저장 경로에도 똑같이 있다.
    # 잠금 프로토콜을 도입하려면 별도 설계가 필요하므로 이슈로 분리한다.
    # 범위는 이 함수 하나에 묶는다. 넓게 잡으면 앞으로 다른 곳에서 생길
    # repair/replace 경합까지 만료일까지 조용히 덮는다 (적대 리뷰 지적).
    - id: "repair-replace-toctou"
      # 함수명으로만 좁혔더니 리뷰어가 파일:줄 로만 지목한 회차에 매칭이
      # 어긋났다 (tool_install waiver 때와 같은 교훈 — 제목 정규식으로
      # 좁히는 방향은 신뢰할 수 없다). 파일 + TOCTOU 어휘로 고정한다.
      # 여전히 anchor_tools.py 밖의 경합은 덮지 않는다.
      match: "(anchor_tools\\.py|repair_crossing_anchors).*(TOCTOU|toctou|check/replace)|(TOCTOU|toctou).*(anchor_tools\\.py|repair_crossing_anchors)"
      reason: "repair_crossing_anchors 의 파일 교체와 외부 편집기 저장 사이의 경합. 조건부 원자 교체 API 가 없고 권고 잠금은 편집기가 안 지켜 원리적으로 제거 불가. 창은 stage 후 os.replace 직전으로 최소화했고 테스트로 고정. 잠금 프로토콜은 별도 설계 과제."
      accepted_by: "choa712"
      expires: "2026-09-11"
